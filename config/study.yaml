# Study configuration for the Phase 0 inventory of the raw SEER export.
# Study: Waiting for prostate cancer treatment: how much is clinical need? A machine learning analysis
# of social position and time to treatment (see PROTOCOL.md)
#
# Every constant the analysis uses lives here. Column specs classify exported SEER
# labels as missing (unknown), not applicable, or top-coded; `Blank(s)` is handled
# globally and is structural outside a column's era. Labels not listed are treated
# as recorded values and appear in full in reports/phase0.md for review.

seed: 20260913

paths:
  export: data/raw/export.txt
  dictionary: data/raw/export.dic
  archive: data/raw/export.zip
  archive_member: export.txt
  selection_note: data/raw/shared.txt
  session_file: data/raw/seer_session.slf
  reports_dir: reports
  tables_dir: reports/phase0_tables

data:
  expected_columns: 41
  expected_rows: 793214          # line count of export.txt, checked before any analysis
  id_column: "Patient ID"
  year_column: "Year of diagnosis"
  year_min: 2010
  year_max: 2023
  blank_label: "Blank(s)"

# Roles are fixed by the study brief, using the exact exported column names.
roles:
  clinical:
    - "Combined Summary Stage with Expanded Regional Codes (2004+)"
    - "Gleason Score Clinical Recode (2010+)"
    - "Gleason Score Pathological Recode (2010+)"
    - "Gleason Patterns Clinical Recode (2010+)"
    - "Gleason Patterns Pathological Recode (2010+)"
    - "PSA Lab Value Recode (2010+)"
    - "Age recode with <1 year olds and 90+"
    - "Year of diagnosis"
  nonclinical:
    - "Race and origin (recommended by SEER)"
    - "Marital status at diagnosis"
    - "Rural-Urban Continuum Code"
    - "Median household income inflation adj to 2024"
  treatment:
    - "RX Summ--Surg Prim Site (1998-2022)"
    - "RX Summ--Surg Prim Site 2023 (2023+)"
    - "Radiation recode"
    - "Chemotherapy recode (yes, no/unk)"
    - "Reason no cancer-directed surgery"
  outcome:
    - "Time from diagnosis to treatment in days recode"
    - "Survival months"
    - "Survival Days"
    - "Survival months flag"
    - "Vital status recode (study cutoff used)"
    - "SEER cause-specific death classification"
    - "SEER other cause of death classification"
  cohort:
    - "Sequence number"
  secondary:
    - "AJCC ID (2018+)"
    - "Derived AJCC M, 7th ed (2010-2015)"
    - "Derived AJCC T, 7th ed (2010-2015)"
    - "Derived AJCC N, 7th ed (2010-2015)"
    - "Derived EOD 2018 T Recode (2018+)"
    - "Derived EOD 2018 N Recode (2018+)"
    - "Derived EOD 2018 M Recode (2018+)"
    - "Derived EOD 2018 Stage Group Recode (2018+)"
    - "7th Edition Stage Group Recode (2016-2017)"
    - "PSA (Prostatic Specific Antigen) Lab Value (2018+)"
    - "Grade Clinical (2018+)"
    - "Grade Pathological (2018+)"

columns:
  "Patient ID":
    kind: identifier
    source: &items "SEER November 2025 data items list (seer.cancer.gov/data-software/documentation/seerstat/nov2025/seerstat-variable-dictionary-nov2025.pdf)"
    note: "Dummy number. One person with several primaries keeps the same Patient ID; the number is not stable across submissions."

  "Year of diagnosis":
    kind: categorical
    source: *items
    note: "SEER states there are no unknown values."

  "Time from diagnosis to treatment in days recode":
    kind: numeric_string
    unit: days
    missing: ["Unable to calculate"]
    top_codes: ["731+ days"]
    source: &tx "SEER treatment data limitations, November 2025 (seer.cancer.gov/data-software/documentation/seerstat/nov2025/treatment-limitations-nov2025.html) and the November 2025 data items list"
    note: "Number of days from diagnosis to the date of initial treatment, calculated from complete dates. The first course of treatment can be chemotherapy, hormone therapy, immunotherapy, radiation, surgery, or a decision to start active surveillance. Intervals above 730 days are assigned 731."
    label_notes:
      "Unable to calculate": "No day count; SEER computes the interval only from complete dates, and a missing date component gives no value."
      "731+ days": "Interval longer than 730 days (2 years); SEER assigns 731."

  "Age recode with <1 year olds and 90+":
    kind: categorical
    source: *items
    note: "20 age groups based on single-year age at diagnosis."

  "Race and origin (recommended by SEER)":
    kind: categorical
    source: *items
    note: "The .dic records this column as a SEER*Stat grouping built on 'Race and origin recode (NHW, NHB, NHAIAN, NHAPI, Hispanic)~PRCDA 2020'. The base variable is available in case listings."

  "Marital status at diagnosis":
    kind: categorical
    missing: ["Unknown"]
    source: *items

  "AJCC ID (2018+)":
    kind: categorical
    not_applicable: ["No AJCC Chapter"]
    era: {first_year: 2018, last_year: null}
    source: *items
    note: "When AJCC staging is not applicable SEER assigns XX, exported as 'No AJCC Chapter'."

  "Derived AJCC M, 7th ed (2010-2015)":
    kind: categorical
    not_applicable: ["NA"]
    era: {first_year: 2010, last_year: 2015}
    source: &ajcc "SEER AJCC stage variables (seer.cancer.gov/seerstat/variables/seer/ajcc-stage/)"

  "Derived AJCC T, 7th ed (2010-2015)":
    kind: categorical
    missing: ["TX"]
    not_applicable: ["NA"]
    era: {first_year: 2010, last_year: 2015}
    source: *ajcc

  "Derived AJCC N, 7th ed (2010-2015)":
    kind: categorical
    missing: ["NX"]
    not_applicable: ["NA"]
    era: {first_year: 2010, last_year: 2015}
    source: *ajcc

  "Derived EOD 2018 T Recode (2018+)":
    kind: categorical
    missing: ["TX"]
    not_applicable: ["88"]
    era: {first_year: 2018, last_year: null}
    source: &eod "SEER EOD 2018 coding (staging.seer.cancer.gov) and the November 2025 data items list"

  "Derived EOD 2018 N Recode (2018+)":
    kind: categorical
    missing: ["NX"]
    not_applicable: ["88"]
    era: {first_year: 2018, last_year: null}
    source: *eod

  "Derived EOD 2018 M Recode (2018+)":
    kind: categorical
    not_applicable: ["88"]
    era: {first_year: 2018, last_year: null}
    source: *eod

  "Derived EOD 2018 Stage Group Recode (2018+)":
    kind: categorical
    missing: ["99"]
    not_applicable: ["88"]
    era: {first_year: 2018, last_year: null}
    source: *eod

  "7th Edition Stage Group Recode (2016-2017)":
    kind: categorical
    missing: ["UNK Stage"]
    not_applicable: ["NA"]
    era: {first_year: 2016, last_year: 2017}
    source: *items

  "Combined Summary Stage with Expanded Regional Codes (2004+)":
    kind: categorical
    missing: ["Unknown/unstaged/unspecified/DCO"]
    source: *items
    note: "Built from SEER Combined Summary Stage 2000 (2004-2017) and Derived Summary Stage 2018 (2018+); pre-2018 Regional NOS re-categorised using regional nodes positive."

  "Gleason Patterns Clinical Recode (2010+)":
    kind: categorical
    missing:
      - "Not documented; Not assessed or unknown if assessed"
      - "Primary pattern unknown, secondary pattern unknown"
    not_applicable: ["No needle core biopsy/TURP performed"]
    source: &ssdi "SEER site-specific data item recodes (seer.cancer.gov/seerstat/variables/seer/ssdi/) and the November 2025 data items list"
    note: "Coded only for cases in the Prostate schema of both TNM 7/CS v0204+ Schema Recode and EOD Schema ID Recode; other schemas are blank."

  "Gleason Patterns Pathological Recode (2010+)":
    kind: categorical
    missing:
      - "Not documented; Not assessed or unknown if assessed"
      - "Primary pattern unknown, secondary pattern unknown"
    not_applicable: ["No prostatectomy/autopsy performed"]
    source: *ssdi
    note: "Coded only for Prostate schema cases. Recorded only when the prostate was removed at prostatectomy or autopsy."

  "Gleason Score Clinical Recode (2010+)":
    kind: categorical
    missing: ["Not documented; Not assessed or unknown if assessed"]
    not_applicable:
      - "No needle core biopsy/TURP performed"
      - "Not applicable: Information not collected for this case"
    source: *ssdi
    note: "Coded only for Prostate schema cases."

  "Gleason Score Pathological Recode (2010+)":
    kind: categorical
    missing: ["Not documented; Not assessed or unknown if assessed"]
    not_applicable:
      - "No prostatectomy done"
      - "Not applicable: Information not collected for this case"
    source: *ssdi
    note: "Coded only for Prostate schema cases. Recorded only after prostatectomy."

  "PSA (Prostatic Specific Antigen) Lab Value (2018+)":
    kind: numeric_string
    unit: ng/ml
    missing:
      - "Not documented; not assessed; unknown"
      - "Test ordered, results not in chart"
      - "Lab value not available, physician states PSA is positive/elevated/high"
      - "Lab value not available, physician states PSA is negative/normal"
    top_codes:
      - "1,000 ng/ml or greater"
      - "0.1 or less nanograms/milliliter (ng/ml)"
    era: {first_year: 2018, last_year: null}
    source: *ssdi
    note: "NAACCR item 3920, in ng/ml. The two 'physician states' labels carry a qualitative result but no value; they are counted as missing a value here."

  "PSA Lab Value Recode (2010+)":
    kind: numeric_string
    unit: ng/ml
    missing:
      - "Not documented; not assessed; unknown"
      - "Test ordered, results not in chart"
    top_codes:
      - "98.0 ng/ml or greater"
      - "0.1 or less nanograms/milliliter (ng/ml)"
    source: *ssdi
    note: "Coded only for Prostate schema cases. Built from NAACCR item 3920 and CS site-specific factor 1; in ng/ml."

  "Grade Clinical (2018+)":
    kind: categorical
    missing: ["9"]
    era: {first_year: 2018, last_year: null}
    source: &grade "NAACCR SSDI and Grade Manual, Grade Clinical (item 3843) and Grade Pathological (item 3844); code 9 is unknown or not assessed"

  "Grade Pathological (2018+)":
    kind: categorical
    missing: ["9"]
    era: {first_year: 2018, last_year: null}
    source: *grade
    note: "Code 9 also covers cases with no surgical resection, so it mixes unknown with not applicable."

  "Grade Recode (thru 2017)":
    kind: categorical
    missing: ["Unknown"]
    era: {first_year: 1975, last_year: 2017}
    source: *items

  "Rural-Urban Continuum Code":
    kind: categorical
    missing:
      - "Unknown/missing/no match (Alaska or Hawaii - Entire State)"
      - "Unknown/missing/no match/Not 1990-2024"
    source: &county "SEER county attributes, time dependent (1990-2024) income and rurality (seer.cancer.gov/seerstat/variables/countyattribs/)"

  "Median household income inflation adj to 2024":
    kind: categorical
    missing: ["Unknown/missing/no match/Not 1990-2024"]
    source: *county

  "RX Summ--Surg Prim Site (1998-2022)":
    kind: categorical
    missing: ["99"]
    era: {first_year: 1998, last_year: 2022}
    source: &surg "SEER Program Coding and Staging Manual, Appendix C prostate surgery codes, 2021 and 2023 editions (seer.cancer.gov/manuals/2023/AppendixC/Surgery_Codes_Prostate_2023.pdf)"
    note: "NAACCR item 1290. Code 00 is no surgery; 99 is unknown whether surgery was performed."

  "RX Summ--Surg Prim Site 2023 (2023+)":
    kind: categorical
    missing: ["A990"]
    era: {first_year: 2023, last_year: null}
    source: *surg
    note: "NAACCR item 1291. Code A000 is no surgery; A990 is unknown; A500 is radical prostatectomy NOS."

  "Radiation recode":
    kind: categorical
    missing: ["Recommended, unknown if administered"]
    source: *tx
    note: "Unknown is combined with None in this recode, so 'None/Unknown' cannot separate no radiation from unrecorded radiation."
    label_notes:
      "None/Unknown": "No evidence of radiation in the records examined, or unknown; SEER does not separate the two."

  "Chemotherapy recode (yes, no/unk)":
    kind: categorical
    source: *tx
    note: "No and Unknown are combined."

  "Sequence number":
    kind: categorical
    missing: ["Unknown seq num - federally required in situ or malig tumors"]
    source: *items
    note: "NAACCR item 380, Sequence Number--Central."

  "Reason no cancer-directed surgery":
    kind: categorical
    missing:
      - "Unknown; death certificate; or autopsy only (2003+)"
      - "Recommended, unknown if performed"
    source: *items

  "Survival months":
    kind: numeric_string
    unit: months
    missing: ["Unknown"]
    source: &surv "SEER survival time calculation (seer.cancer.gov/survivaltime/)"
    note: "NAACCR item 1784, calculated from complete dates including day."

  "Survival Days":
    kind: numeric_string
    unit: days
    missing: ["Unknown"]
    source: *surv

  "Survival months flag":
    kind: categorical
    not_applicable: ["Not calculated because a Death Certificate Only or Autopsy Only case"]
    source: *surv
    note: "NAACCR item 1783."

  "Vital status recode (study cutoff used)":
    kind: categorical
    source: *items
    note: "A death after the follow-up cutoff is recoded to alive at the cutoff."

  "SEER cause-specific death classification":
    kind: categorical
    missing: ["Dead (missing/unknown COD)"]
    not_applicable: ["N/A not seq 0-59"]
    source: &cod "SEER cause-specific death classification (seer.cancer.gov/causespecific/)"
    note: "The missing/unknown cause category exists from the November 2017 submission; earlier such deaths were classed as other cause."

  "SEER other cause of death classification":
    kind: categorical
    missing: ["Dead (missing/unknown COD)"]
    not_applicable: ["N/A not seq 0-59"]
    source: *cod

  "COD to site recode":
    kind: categorical
    missing: ["State DC not available or state DC available but no COD"]
    source: *items
    note: "Study cutoff applied: a death after the cutoff is coded alive."

  "COD to site recode ICD-O-3 2023 Revision":
    kind: categorical
    missing: ["State DC not available or state DC available but no COD"]
    source: *items
    note: "Study cutoff applied: a death after the cutoff is coded alive."

inventory:
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  time_to_treatment_bin_edges: [0, 1, 31, 61, 91, 181, 366, 731]
  time_to_treatment_column: "Time from diagnosis to treatment in days recode"
  sequence_column: "Sequence number"
  first_primary_strict: ["One primary only"]
  first_primary_inclusive: ["One primary only", "1st of 2 or more primaries"]
  reason_no_surgery_column: "Reason no cancer-directed surgery"
  stage_column: "Combined Summary Stage with Expanded Regional Codes (2004+)"
  clinical_grade_columns:
    - "Gleason Score Clinical Recode (2010+)"
    - "Gleason Patterns Clinical Recode (2010+)"
  pathological_grade_columns:
    - "Gleason Score Pathological Recode (2010+)"
    - "Gleason Patterns Pathological Recode (2010+)"
  psa_columns:
    - "PSA Lab Value Recode (2010+)"
    - "PSA (Prostatic Specific Antigen) Lab Value (2018+)"
  surgery_columns:
    - "RX Summ--Surg Prim Site (1998-2022)"
    - "RX Summ--Surg Prim Site 2023 (2023+)"
  surgery_none_codes: ["00", "A000"]
  surgery_unknown_codes: ["99", "A990"]
  # Facts the brief states are unavailable; a match in the column names would contradict it.
  absent_variable_keywords:
    insurance: ["insurance", "payer"]
    registry: ["registry"]
    month_of_diagnosis: ["month of diagnosis", "month diagnosis"]
    comorbidity: ["comorbid"]
  # Listed as available in case listings from the SEER Research database (November 2025 data items list).
  available_not_exported:
    type_of_reporting_source: "`Type of Reporting Source` is needed to exclude autopsy-only and death-certificate-only cases as the protocol requires; the export offers only indirect proxies (Survival months flag, Reason no cancer-directed surgery, Combined Summary Stage `DCO`)."
    race: "`Race and origin recode (NHW, NHB, NHAIAN, NHAPI, Hispanic)` is the base of the exported race column and would restore the categories."
    histology: "`Histologic Type ICD-O-3` would allow restriction to adenocarcinoma; `AJCC ID (2018+)` shows sarcoma codes in the export."
  age_column: "Age recode with <1 year olds and 90+"
  age_labels_below_18: ["00 years", "01-04 years", "05-09 years", "10-14 years"]
  age_labels_straddling_18: ["15-19 years"]
  radiation_column: "Radiation recode"
  expected_selection_variables: ["Site recode", "Year of diagnosis"]
  session_file_extensions: [".slf", ".slm"]
  suspect_label_patterns:
    - "unknown"
    - "\\bunk\\b"
    - "not documented"
    - "not assessed"
    - "not available"
    - "not applicable"
    - "no match"
    - "^NA$"
    - "^N/A"
    - "^88$"
    - "^99$"
    - "^9$"
